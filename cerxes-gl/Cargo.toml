# SPDX-License-Identifier: AGPL-3.0-or-later
#
# CErXes (terotests/componentengine, AGPL) as a WebAssembly module whose
# scripts can call the page synchronously: __hostSync(text) goes to the
# import cerxes_host.sync. The GL bridge (../cerxes-gl/gl-client.js inside
# the engine, gl-host.js in the page) uses it to drive a real WebGL2
# context. Linked with CErXes, so this crate is AGPL-3.0-or-later like it;
# the JavaScript next to it is MIT like the rest of RangerThree.
#
#   cargo build --release --target wasm32-wasip1 --features wjit
#     (RUSTFLAGS="-C link-arg=--export-table -C link-arg=--growable-table")

[package]
name = "cerxes-gl"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
cerxes = { git = "https://github.com/terotests/componentengine.git", rev = "679715c" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
overflow-checks = false
debug = false
panic = "abort"

[workspace]

[features]
wjit = ["cerxes/wjit"]
